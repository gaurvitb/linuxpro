# ==============================================================================
# LINUXPULSE - Task 5: Apache VirtualHost on Custom Port 82
# Target: /etc/httpd/conf.d/capstone.conf on server1.example.com
# ==============================================================================
<VirtualHost *:82>
    ServerName server1.example.com
    DocumentRoot /data/web

    <Directory /data/web>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog logs/capstone_error.log
    CustomLog logs/capstone_access.log combined
</VirtualHost>

